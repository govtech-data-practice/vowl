site_name: ODCS Data Contract Validation Engine
site_description: >-
  vowl is a validation engine for Open Data Contract Standard (ODCS) data contracts.
  Define validation rules once in declarative YAML and get rich, actionable reports
  on data quality across pandas, Polars, PySpark, and 20+ Ibis backends.
site_url: https://govtech-data-practice.github.io/vowl/
repo_url: https://github.com/govtech-data-practice/vowl
repo_name: govtech-data-practice/vowl

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/govtech-data-practice/vowl

theme:
  name: material
  custom_dir: docs/overrides
  logo: img/vowl_logo.png
  favicon: img/vowl_logo.png
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Get Started:
      - Overview: index.md
      - Quick Start: getting-started.md
      - Key Terms: key-terms.md
  - Guides:
      - Writing Data Contracts: contracts.md
      - Connecting to Your Data: usage-patterns.md
      - Loading Contracts: loading-contracts.md
      - Reading Results: results.md
      - Handling of Failed Rows: failed-rows.md
      - How Failed Rows Are Merged: merging-failed-rows.md
      - DQ Metrics:
          - dq-metrics/index.md
          - Exporting to OpenTelemetry: dq-metrics/otel-export.md
          - Exporting to dq_metrics.json: dq-metrics/json-export.md
  - Reference:
      - How vowl Works: architecture.md
      - Design Decisions: design-considerations.md
      - Known Issues & Caveats: known-issues.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - meta

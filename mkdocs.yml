site_name: ODCS Data Contract Validation Engine
site_description: >-
  vowl is a validation engine for Open Data Contract Standard (ODCS) data contracts.
  Define validation rules once in declarative YAML and get rich, actionable reports
  on data quality across pandas, Polars, PySpark, and 20+ Ibis backends.
site_url: https://govtech-data-practice.github.io/vowl/
repo_url: https://github.com/govtech-data-practice/vowl
repo_name: govtech-data-practice/vowl

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/govtech-data-practice/vowl

theme:
  name: material
  custom_dir: docs/overrides
  logo: img/vowl_logo.png
  favicon: img/vowl_logo.png
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Get Started: getting-started.md
  - Guides:
      - Data Quality with Data Contracts: contracts.md
      - Connecting to Your Data: usage-patterns.md
      - The Results Object: results.md
      - Run Settings: run-settings.md
      - DQ Metrics:
          - dq-metrics/index.md
          - Exporting to OpenTelemetry: dq-metrics/otel-export.md
          - Exporting to dq_metrics.json: dq-metrics/json-export.md
  - Design Considerations:
      - How vowl Works: architecture.md
      - How Failed Rows Are Derived:
          - The Count Query and the Failed Rows Query: design-considerations/failed-rows/queries.md
          - Which Checks Contribute Failed Rows: design-considerations/failed-rows/which-checks.md
          - Failed Rows at Each Level: design-considerations/failed-rows/levels.md
          - Capping Failed Rows: design-considerations/failed-rows/capping.md
      - Cross-Server and Cross-Table Checks:
          - How Cross-Server and Cross-Table Checks Work: design-considerations/cross-table/how-it-works.md
          - Using Relationship References: design-considerations/cross-table/relationship-references.md
      - Known Issues & Caveats: known-issues.md
  - Glossary: glossary.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - meta

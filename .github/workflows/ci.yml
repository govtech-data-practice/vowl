name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run ruff lint
        run: uvx ruff check src/ tests/

      - name: Check Python formatting
        run: uvx ruff format --check src/ tests/

      - name: Check Markdown formatting
        run: npx --yes prettier --check "**/*.md"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group lean-ci-test

      - name: Run tests
        run: uv run pytest -m "not docker_integration" tests/

  # The lock pins the newest OpenTelemetry, so run the OTel tests on the
  # [otel] extra's floor too. Log records lost their Resource on 1.27 to 1.38.
  test-otel-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # SDK 1.27 pins protobuf<5, which does not import on Python 3.14.
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run the OTel tests on SDK 1.27
        env:
          # The shallow checkout has no tags for setuptools-scm to read.
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: >-
          uv run --isolated --python 3.12 --with-editable .
          --with opentelemetry-sdk==1.27.0
          --with opentelemetry-exporter-otlp==1.27.0
          --with pytest
          pytest tests/test_otel_export.py

  # Build the sdist, install it into a clean environment and run a validation
  # from outside the checkout, so a module or data file MANIFEST.in leaves out
  # fails here instead of on PyPI.
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build the sdist
        env:
          # The shallow checkout has no tags for setuptools-scm to read.
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: uv build --sdist

      - name: Install the sdist into a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "vowl[otel] @ file://$(ls "$PWD"/dist/*.tar.gz)" pandas

      - name: Run the smoke test outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -I
          "$GITHUB_WORKSPACE/tests/package_smoke.py"
          "$GITHUB_WORKSPACE/tests/hdb_resale"

  publish:
    needs: [test, test-otel-floor, package-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync

      - name: Build and validate
        run: make release-check

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
